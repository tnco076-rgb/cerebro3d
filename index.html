<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Atlas Cerebral 3D</title>


<style>

/* ==============================
   CONFIGURACIÓN GENERAL
================================ */

* {
    box-sizing: border-box;
}

html,
body {

    margin: 0;

    width: 100%;
    height: 100%;

    overflow: hidden;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:
        #0b1020;

}


/* ==============================
   ÁREA DEL CEREBRO
================================ */

#canvas {

    position: fixed;

    inset: 0;

    width: 100%;
    height: 100%;

}


/* ==============================
   BARRA SUPERIOR
================================ */

.header {

    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 70px;

    display: flex;

    align-items: center;

    padding-left: 28px;

    background:
        rgba(10,15,30,.92);

    border-bottom:
        1px solid
        rgba(255,255,255,.1);

    color: white;

    z-index: 20;

}


.header h1 {

    margin: 0;

    font-size: 22px;

}


.header span {

    margin-left: 15px;

    opacity: .55;

    font-size: 14px;

}


/* ==============================
   MENÚ DE ESTRUCTURAS
================================ */

.menu {

    position: fixed;

    top: 90px;
    left: 20px;

    width: 220px;

    padding: 18px;

    background:
        rgba(255,255,255,.96);

    border-radius: 16px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.3);

    z-index: 15;

}


.menu h3 {

    margin:
        0 0 15px 0;

    font-size: 16px;

}


.menu button {

    width: 100%;

    border: none;

    padding: 12px;

    margin-bottom: 8px;

    border-radius: 9px;

    background:
        #e9edf3;

    cursor: pointer;

    text-align: left;

    font-size: 14px;

    transition:
        .2s;

}


.menu button:hover {

    background:
        #dce2ea;

}


.menu button.active {

    background:
        #111827;

    color:
        white;

}


/* ==============================
   PANEL DE INFORMACIÓN
================================ */

.info {

    position: fixed;

    top: 90px;
    right: 20px;

    width: 330px;

    max-height:
        calc(100vh - 110px);

    overflow-y: auto;

    padding: 24px;

    background:
        rgba(255,255,255,.97);

    border-radius: 17px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.3);

    z-index: 15;

    display: none;

}


.info.show {

    display: block;

}


.info h2 {

    margin-top: 0;

    font-size: 25px;

}


.info h3 {

    margin-bottom: 5px;

}


.info p {

    color:
        #374151;

    line-height:
        1.55;

}


.close {

    position: absolute;

    right: 15px;
    top: 10px;

    border: none;

    background: none;

    font-size: 25px;

    cursor: pointer;

}


/* ==============================
   BOTONES INFERIORES
================================ */

.controls {

    position: fixed;

    bottom: 25px;

    left: 50%;

    transform:
        translateX(-50%);

    display: flex;

    gap: 8px;

    z-index: 20;

}


.controls button {

    border: none;

    padding:
        10px 16px;

    border-radius: 10px;

    background:
        rgba(255,255,255,.95);

    cursor: pointer;

    font-size: 14px;

}


/* ==============================
   INSTRUCCIONES
================================ */

.instructions {

    position: fixed;

    bottom: 20px;

    left: 20px;

    color: white;

    opacity: .65;

    font-size: 12px;

    z-index: 10;

}


/* ==============================
   CARGANDO
================================ */

#loading {

    position: fixed;

    inset: 0;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        #0b1020;

    color: white;

    font-size: 20px;

    z-index: 100;

}


#loading.hidden {

    display: none;

}


/* ==============================
   ERROR
================================ */

#error {

    display: none;

    position: fixed;

    left: 50%;
    top: 50%;

    transform:
        translate(-50%,-50%);

    padding: 30px;

    background: white;

    border-radius: 15px;

    z-index: 200;

    max-width: 500px;

}


</style>

</head>


<body>


<!-- =================================
     CARGANDO
================================== -->

<div id="loading">

    Cargando cerebro 3D...

</div>


<!-- =================================
     CANVAS
================================== -->

<div id="canvas"></div>


<!-- =================================
     ENCABEZADO
================================== -->

<div class="header">

    <h1>
        🧠 Atlas Cerebral 3D
    </h1>

    <span>
        Modelo anatómico interactivo
    </span>

</div>


<!-- =================================
     MENÚ
================================== -->

<div class="menu">

    <h3>
        Estructuras cerebrales
    </h3>


    <button
        onclick="seleccionar('frontal')">

        Lóbulo frontal

    </button>


    <button
        onclick="seleccionar('parietal')">

        Lóbulo parietal

    </button>


    <button
        onclick="seleccionar('temporal')">

        Lóbulo temporal

    </button>


    <button
        onclick="seleccionar('occipital')">

        Lóbulo occipital

    </button>


    <button
        onclick="seleccionar('cerebelo')">

        Cerebelo

    </button>


    <button
        onclick="seleccionar('tronco')">

        Tronco encefálico

    </button>

</div>


<!-- =================================
     INFORMACIÓN
================================== -->

<div
    class="info"
    id="info">


    <button
        class="close"
        onclick="cerrarInfo()">

        ×

    </button>


    <h2 id="titulo">

        Lóbulo cerebral

    </h2>


    <h3>
        ¿Qué es?
    </h3>


    <p id="descripcion"></p>


    <h3>
        Funciones principales
    </h3>


    <p id="funciones"></p>


</div>


<!-- =================================
     CONTROLES
================================== -->

<div class="controls">


    <button onclick="reiniciar()">

        ↻ Reiniciar

    </button>


    <button onclick="zoomIn()">

        +

    </button>


    <button onclick="zoomOut()">

        −

    </button>


</div>


<div class="instructions">

    Arrastra para girar ·
    rueda para acercar ·
    selecciona una estructura

</div>



<!-- =================================
     THREE.JS
================================== -->

<script type="importmap">

{

    "imports": {

        "three":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",

        "three/addons/":
        "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"

    }

}

</script>



<script type="module">


import * as THREE
from "three";


import { OrbitControls }

from
"three/addons/controls/OrbitControls.js";


import { GLTFLoader }

from
"three/addons/loaders/GLTFLoader.js";



/* =================================
   ESCENA
================================= */

const scene =
    new THREE.Scene();


scene.background =
    new THREE.Color(
        0x0b1020
    );



/* =================================
   CÁMARA
================================= */

const camera =

    new THREE.PerspectiveCamera(

        45,

        window.innerWidth /
        window.innerHeight,

        0.1,

        1000

    );


camera.position.set(
    0,
    0,
    5
);



/* =================================
   RENDERIZADOR
================================= */

const renderer =

    new THREE.WebGLRenderer({

        antialias: true

    });


renderer.setPixelRatio(
    window.devicePixelRatio
);


renderer.setSize(

    window.innerWidth,

    window.innerHeight

);


renderer.outputColorSpace =
    THREE.SRGBColorSpace;


document
    .getElementById("canvas")
    .appendChild(
        renderer.domElement
    );



/* =================================
   LUCES
================================= */

const ambient =

    new THREE.AmbientLight(

        0xffffff,

        2

    );


scene.add(
    ambient
);



const light =

    new THREE.DirectionalLight(

        0xffffff,

        3

    );


light.position.set(
    5,
    5,
    5
);


scene.add(
    light
);



const light2 =

    new THREE.DirectionalLight(

        0xffffff,

        2

    );


light2.position.set(
    -5,
    -3,
    3
);


scene.add(
    light2
);



/* =================================
   CONTROLES 3D
================================= */

const controls =

    new OrbitControls(

        camera,

        renderer.domElement

    );


controls.enableDamping =
    true;


controls.dampingFactor =
    0.05;


controls.minDistance =
    1;


controls.maxDistance =
    12;



/* =================================
   CEREBRO
================================= */

let brain = null;

let originalPosition = null;

let originalScale = null;


/* =================================
   CARGAR GLB
================================= */

const loader =
    new GLTFLoader();


loader.load(

    "cerebro.glb",


    function(gltf) {


        brain =
            gltf.scene;


        scene.add(
            brain
        );


        /* CENTRAR */

        const box =

            new THREE.Box3()
                .setFromObject(
                    brain
                );


        const center =

            box.getCenter(
                new THREE.Vector3()
            );


        brain.position.sub(
            center
        );


        /* ESCALAR */

        const size =

            box.getSize(
                new THREE.Vector3()
            );


        const maxSize =

            Math.max(
                size.x,
                size.y,
                size.z
            );


        const escala =
            3 / maxSize;


        brain.scale.setScalar(
            escala
        );


        originalPosition =
            brain.position.clone();


        originalScale =
            brain.scale.clone();


        /* GUARDAR MATERIALES */

        brain.traverse(
            object => {

                if(
                    object.isMesh
                ){

                    object.userData
                        .materialOriginal =
                            object.material;

                }

            }
        );


        document
            .getElementById(
                "loading"
            )
            .classList
            .add("hidden");


        console.log(
            "Cerebro cargado correctamente"
        );


        console.log(
            "Partes encontradas:"
        );


        brain.traverse(
            object => {

                if(
                    object.isMesh
                ){

                    console.log(
                        object.name
                    );

                }

            }
        );


    },


    undefined,


    function(error){

        console.error(
            error
        );


        document
            .getElementById(
                "loading"
            )
            .classList
            .add("hidden");


        document
            .getElementById(
                "error"
            )
            .style
            .display =
                "block";

    }

);



/* =================================
   INFORMACIÓN
================================= */

const datos = {


    frontal: {

        titulo:
            "Lóbulo frontal",

        descripcion:
            "Es la región anterior de la corteza cerebral.",

        funciones:
            "Participa en planificación, toma de decisiones, atención, control de la conducta, lenguaje y movimiento voluntario."

    },


    parietal: {

        titulo:
            "Lóbulo parietal",

        descripcion:
            "Se encuentra detrás del lóbulo frontal.",

        funciones:
            "Participa en el procesamiento de información sensorial, orientación espacial e integración de estímulos."

    },


    temporal: {

        titulo:
            "Lóbulo temporal",

        descripcion:
            "Se encuentra en las regiones laterales del cerebro.",

        funciones:
            "Participa en memoria, comprensión del lenguaje y procesamiento de información auditiva."

    },


    occipital: {

        titulo:
            "Lóbulo occipital",

        descripcion:
            "Se encuentra en la región posterior del cerebro.",

        funciones:
            "Está principalmente relacionado con el procesamiento de la información visual."

    },


    cerebelo: {

        titulo:
            "Cerebelo",

        descripcion:
            "Se encuentra en la región posterior e inferior del encéfalo.",

        funciones:
            "Participa en coordinación de movimientos, equilibrio y aprendizaje motor."

    },


    tronco: {

        titulo:
            "Tronco encefálico",

        descripcion:
            "Conecta el encéfalo con la médula espinal.",

        funciones:
            "Participa en funciones fundamentales como respiración, regulación cardiovascular y comunicación entre diferentes regiones del sistema nervioso."

    }

};



/* =================================
   SELECCIONAR
================================= */

window.seleccionar =

function(nombre){


    const data =
        datos[nombre];


    if(!data)
        return;


    document
        .getElementById(
            "titulo"
        )
        .textContent =
            data.titulo;


    document
        .getElementById(
            "descripcion"
        )
        .textContent =
            data.descripcion;


    document
        .getElementById(
            "funciones"
        )
        .textContent =
            data.funciones;


    document
        .getElementById(
            "info"
        )
        .classList
        .add("show");


    /* QUITAR SELECCIÓN */

    if(brain){

        brain.traverse(
            object => {

                if(
                    object.isMesh
                ){

                    const original =
                        object
                        .userData
                        .materialOriginal;


                    if(original){

                        object.material =
                            original;

                    }

                }

            }
        );


        /* BUSCAR LÓBULO */

        brain.traverse(
            object => {


                if(
                    !object.isMesh
                )
                    return;


                const nombreObjeto =

                    object.name
                        .toLowerCase();


                if(
                    nombreObjeto
                        .includes(
                            nombre
                        )
                ){


                    object.material =
                        object
                        .material
                        .clone();


                    object.material
                        .emissive =
                            new THREE.Color(
                                0x00ffff
                            );


                    object.material
                        .emissiveIntensity =
                            0.8;

                }

            }
        );

    }

};



/* =================================
   CERRAR INFORMACIÓN
================================= */

window.cerrarInfo =

function(){

    document
        .getElementById(
            "info"
        )
        .classList
        .remove("show");

};



/* =================================
   REINICIAR
================================= */

window.reiniciar =

function(){


    if(!brain)
        return;


    brain.position.copy(
        originalPosition
    );


    brain.scale.copy(
        originalScale
    );


    camera.position.set(
        0,
        0,
        5
    );


    controls.target.set(
        0,
        0,
        0
    );


    controls.update();

};



/* =================================
   ZOOM
================================= */

window.zoomIn =

function(){

    camera.position
        .multiplyScalar(
            0.8
        );

};


window.zoomOut =

function(){

    camera.position
        .multiplyScalar(
            1.2
        );

};



/* =================================
   REDIMENSIONAR
================================= */

window.addEventListener(

    "resize",

    function(){


        camera.aspect =

            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(

            window.innerWidth,

            window.innerHeight

        );

    }

);



/* =================================
   ANIMACIÓN
================================= */

function animate(){


    requestAnimationFrame(
        animate
    );


    controls.update();


    renderer.render(

        scene,

        camera

    );

}


animate();


</script>

</body>

</html>
